<!DOCTYPE html>
<html>
<head>
    <title>Add Item</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Add Item</h1>
        <form method="POST" action="/add">
            <input type="text" name="bill_id" placeholder="Bill ID" required><br><br>
            <input type="text" name="item_name" placeholder="Item Name" required><br><br>
            <input type="number" name="item_price" step="0.01" placeholder="Item Price" required><br><br>
            <input type="number" name="item_quantity" placeholder="Quantity" required><br><br>
            <button type="submit" class="btn">Add Item</button>
        </form>
        <br>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
