<!DOCTYPE html>
<html>
<head>
    <title>Print Bill</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Bill Details</h1>

        <form method="post">
            <label>Enter Bill ID:</label>
            <input type="text" name="bill_id" required>
            <input type="submit" value="Print">
        </form>

        {% if error %}
            <p>{{ error }}</p>
        {% endif %}

        {% if items %}
            <p><strong>Bill ID:</strong> {{ bill_id }}</p>
            <table>
                <tr>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Total</th>
                </tr>
                {% for item in items %}
                <tr>
                    <td>{{ item.item_name }}</td>
                    <td>{{ item.qty }}</td>
                    <td>{{ item.price }}</td>
                    <td>{{ item.total_price }}</td>
                </tr>
                {% endfor %}
            </table>
            <h3>Total Amount (with 18% tax): ₹{{ total }}</h3>
        {% endif %}

        <a href="/">Back to Home</a>
    </div>
</body>
</html>
